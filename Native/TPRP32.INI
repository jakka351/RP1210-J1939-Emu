; =============================================================================================
;  TPRP32.INI  —  TMC RP1210 vendor descriptor for the Tester Present RP1210 emulator (TPSAS-RP1210).
;  Installed to %WINDIR%\TPRP32.INI by register.bat / register-vci.ps1. An RP1210 client reads this
;  to enumerate the device and its protocols (J1939, CAT = Cat Data Link, J1708 = ATA/J1587).
;  https://testerpresent.com.au
